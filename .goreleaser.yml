# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: dockertop

before:
  hooks:
    - go mod tidy

builds:
  - id: dockertop
    main: ./cmd/dockertop
    binary: dockertop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - netgo

archives:
  - id: dockertop
    ids:
      - dockertop
    formats:
      - tar.gz
    name_template: "dockertop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: hostatlas-labs
    name: dockertop
  draft: false
  prerelease: auto
  name_template: "dockertop v{{.Version}}"
